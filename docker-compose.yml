services:
  web:
    build: .
    command: >
      sh -c "
      until pg_isready -h db -p 5432; do
        echo 'Waiting for database...';
        sleep 2;
      done;
      python manage.py migrate &&
      python manage.py loaddata breeds_fixture.json || true &&
      python manage.py loaddata breed_comparisons_fixture.json || true &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: pawmatch
      POSTGRES_USER: pawuser
      POSTGRES_PASSWORD: pawpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
